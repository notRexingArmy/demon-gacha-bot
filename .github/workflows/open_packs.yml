name: Open Demon Gacha Packs

on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - 'config.js'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose an action to run'
        required: true
        default: 'open_packs'
        type: choice
        options:
          - open_packs
          - check_time
          - check_packs
          - reset_stats
          - auto_loop

permissions:
  contents: write
  actions: write

jobs:
  quick-action:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'check_time' || github.event.inputs.action == 'check_packs' || github.event.inputs.action == 'reset_stats')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quick-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest state from main
        run: git fetch origin main && git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: github.event.inputs.action == 'check_packs'
        run: npm install

      - name: Run quick action
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RAW_COOKIES: ${{ secrets.RAW_COOKIES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BOT_ACTION: ${{ github.event.inputs.action }}
          SHIFT_NUMBER: '1'
        run: node bot.js

  continuous-loop:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.action != 'check_time' && github.event.inputs.action != 'check_packs' && github.event.inputs.action != 'reset_stats')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: demon-gacha-continuous-loop
      cancel-in-progress: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shift: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest state from main
        run: git fetch origin main && git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run bot shift
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RAW_COOKIES: ${{ secrets.RAW_COOKIES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BOT_ACTION: ${{ github.event.inputs.action || 'auto_loop' }}
          SHIFT_NUMBER: ${{ matrix.shift }}
        run: node bot.js

      - name: Trigger next 24h cycle after Shift 6
        if: always() && matrix.shift == 6 && env.PAT_TOKEN != ''
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh workflow run "Open Demon Gacha Packs" -f action=auto_loop || true